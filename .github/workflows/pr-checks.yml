name: pr-checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly report-only govulncheck run against main (A-17a / C-05).
  schedule:
    - cron: '17 6 * * 1'
  # Manual run, e.g. to read the govulncheck result for a release-candidate SHA.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser-validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.15.4'
          install-only: true
      - name: goreleaser check
        run: goreleaser check
      - name: goreleaser snapshot build
        run: goreleaser release --snapshot --skip=publish --clean --skip=sign
      - name: assert dist contents
        run: |
          set -euo pipefail
          ls dist/
          # Assert the four expected platform archives + checksums file are present
          for arch in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            ls dist/runnerkit_*_${arch}.tar.gz >/dev/null
          done
          ls dist/runnerkit_*_checksums.txt >/dev/null

  go-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      # release.yml's test job runs go vet; run it here too so vet findings
      # (copylocks, lostcancel, ...) fail the PR, not the tag.
      - name: go vet
        run: go vet ./...
      # Tests get a scratch HOME and RunnerKit state directory, no GitHub
      # token and no update check, so none of them can read or write the
      # real ones (C-02). The Go caches stay where setup-go put them.
      - name: go test
        run: |
          set -euo pipefail
          GOCACHE="$(go env GOCACHE)"
          GOMODCACHE="$(go env GOMODCACHE)"
          GOPATH="$(go env GOPATH)"
          export GOCACHE GOMODCACHE GOPATH
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config" XDG_STATE_HOME="$RUNNER_TEMP/home/.local/state" XDG_CACHE_HOME="$RUNNER_TEMP/home/.cache"
          export RUNNERKIT_STATE_DIR="$RUNNER_TEMP/rkstate" RUNNERKIT_NO_UPDATE_NOTIFIER=1
          unset GH_TOKEN GITHUB_TOKEN RUNNERKIT_GITHUB_TOKEN
          mkdir -p "$HOME" "$RUNNERKIT_STATE_DIR"
          go test ./... -count=1 -race
      # --ignored: stray files such as internal/cli/sessions/ are gitignored
      # and would otherwise pass unseen (P1-3).
      - name: tests leave no files in the checkout
        run: |
          set -euo pipefail
          left="$(git status --porcelain --ignored --untracked-files=all)"
          if [ -n "$left" ]; then
            echo "::error::go test left files in the checkout; tests must write under t.TempDir():"
            echo "$left"
            exit 1
          fi

  # CONTRIBUTING.md: every commit carries a DCO Signed-off-by line (H-02).
  # Pull requests opened by the repository's owner, members or collaborators
  # are not checked, as with the DCO app's `require.members: false`; a
  # skipped job counts as passing when this check is required on main.
  dco:
    if: >-
      github.event_name == 'pull_request' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # Only the pull request's own commits: exclude everything on the
          # base branch, including commits merged in from it later. Assigned
          # first so a failing rev-list fails the step instead of checking
          # nothing.
          commits="$(git rev-list --no-merges "$HEAD" --not "$BASE" "origin/$BASE_REF")"
          for c in $commits; do
            msg="$(git log -1 --format=%B "$c")"
            if ! grep -Eq '^Signed-off-by: .+ <[^<>@ ]+@[^<> ]+>[[:space:]]*$' <<<"$msg"; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: Name <email>' line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the line with 'git commit -s'. For existing commits run 'git rebase --signoff $BASE' (the base this pull request was checked against), then force-push; see CONTRIBUTING.md."
            exit 1
          fi

  # Generated files (e.g. install.sh's sudoers block) must be committed in sync
  # with their Go source of truth.
  go-generate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      # `go generate ./... && git diff --exit-code`, plus a check for new
      # untracked files, which git diff does not see. Separate lines so a
      # failing `go generate` stops the step (bash -e ignores failures on
      # the left of `&&`).
      - name: go generate leaves no diff
        run: |
          set -euo pipefail
          go generate ./...
          git diff --exit-code
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "go generate left files that are not committed:"
            echo "$untracked"
            exit 1
          fi

  # Report-only until Stage 2 (C-05): findings go to the job summary and a
  # ::warning:: annotation, and the job stays green so it never trains anyone
  # to ignore a red check. On the current Go 1.26.x toolchain the result is
  # expected to have no reachable findings; any finding is a regression to
  # triage (stdlib: take the Go patch release; module: bump it). Before
  # tagging, read this job's summary for the release SHA.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
      # Pinned; golang.org/x/vuln v1.8.0 requires Go 1.26. Keep it in step
      # with the Makefile's vulncheck target.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck
        run: |
          set -uo pipefail
          rc=0
          govulncheck ./... > govulncheck.txt 2>&1 || rc=$?
          cat govulncheck.txt
          {
            echo "## govulncheck (report-only)"
            echo
            echo "Commit: \`${GITHUB_SHA}\` (event: ${GITHUB_EVENT_NAME}), exit code: ${rc}"
            echo
            echo '```'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::govulncheck reported findings or failed (exit $rc); see the job summary"
          fi
          exit 0
