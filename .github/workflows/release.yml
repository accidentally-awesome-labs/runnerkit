name: release
on:
  push:
    tags: ['v*']

# Least privilege by default; the goreleaser job widens its own scope below.
permissions:
  contents: read

jobs:
  # Test gate (A-10 / C-01): a tag on a commit with failing tests, vet
  # findings or stale generated files must never produce a release.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: go vet
        run: go vet ./...
      # `go generate ./... && git diff --exit-code`, plus a check for new
      # untracked files, which git diff does not see. Separate lines so a
      # failing `go generate` stops the step (bash -e ignores failures on
      # the left of `&&`).
      - name: go generate leaves no diff
        run: |
          set -euo pipefail
          go generate ./...
          git diff --exit-code
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "go generate left files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: go test
        run: go test ./... -count=1 -race

  goreleaser:
    needs: [test]
    # Releases (Homebrew cask bump, OIDC signing) only ever run from the
    # upstream repository; tag pushes on forks stop after the test job.
    if: github.repository == 'accidentally-awesome-labs/runnerkit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: 'v2.15.4'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
